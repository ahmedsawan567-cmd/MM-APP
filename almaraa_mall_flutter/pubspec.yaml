name: almaraa_mall
description: "تطبيق المرأة مول - منظومة التسوق والولاء الفاخرة (Almaraa Mall)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Backend & Database
  supabase_flutter: ^2.6.0
  http: ^1.2.2
  
  # UI & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  
  # Device Capabilities
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
