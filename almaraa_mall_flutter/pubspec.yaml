name: almaraa_mall
description: "تطبيق المرأة مول - منظومة التسوق والولاء الفاخرة (Almaraa Mall)"
publish_to: 'none'
version: 1.5.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Backend API
  http: ^1.2.2
  
  # UI & Styling
  flutter_svg: ^2.0.10+1
  lucide_icons_flutter: ^3.0.0
  intl: ^0.20.2
  
  # Device Capabilities
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/brand/

  # خط تجوال (رخصة SIL Open Font License — انظر assets/fonts/OFL.txt)
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
